name: Release publish

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 0.4.4)'
        required: true
        type: string
      platform:
        description: 'Changed platform'
        required: true
        type: choice
        options:
          - both
          - windows
          - linux

concurrency:
  group: release-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare_game_intro:
    needs: changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write # Draft release assets require write access.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify clip and build Java agent
        id: intro
        uses: ./.github/actions/prepare-game-intro
        with:
          version: ${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Share the verified inputs with the build jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-intro-inputs
          path: |
            ${{ steps.intro.outputs.clip }}
            ${{ steps.intro.outputs.agent }}
            ${{ steps.intro.outputs.agent }}.sha256
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare_game_intro, changelog]
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
            variant: framework
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
            variant: framework
          - configuration: ${{ inputs.configuration }}
            architecture: x64
            variant: selfcontained
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
            variant: selfcontained
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
      variant: ${{ matrix.variant }}
      include_game_intro: true
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os, re
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_VERSION"])
          assert os.environ["RELEASE_PLATFORM"] in {"both", "windows", "linux"}
          metadata = json.load(open("Plain Craft Launcher 2/metadata.json", encoding="utf-8"))["version"]
          assert metadata["base"] == os.environ["RELEASE_VERSION"], f"Release version {os.environ['RELEASE_VERSION']} does not match metadata {metadata['base']}"
          assert metadata.get("platform") == os.environ["RELEASE_PLATFORM"], f"Release platform {os.environ['RELEASE_PLATFORM']} does not match metadata {metadata.get('platform')}"
          PY
          python3 - <<'PY'
          import json, os
          data = {"version": os.environ["RELEASE_VERSION"], "platform": os.environ["RELEASE_PLATFORM"], "releaseTag": "v" + os.environ["RELEASE_VERSION"]}
          json.dump(data, open("PCL3_update.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          PY
          cp docs/mcm-skill/SKILL.md MCM_skill.md
          sha256sum MCM_skill.md > MCM_skill.md.sha256

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "v${{ inputs.version }}"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append download guide
        run: |
          cat >> CHANGELOG.md <<'EOF'

          ## 下载说明 (Download)

          Windows 提供框架依赖版和自带运行时版。选择与电脑匹配的 x64 或 ARM64。

          - `PCL3_${{ inputs.configuration }}_<架构>.exe`：框架依赖版，需要预先安装 [.NET 10 Desktop Runtime](https://get.dot.net/10)。自动更新默认下载该资产。
          - `PCL3_${{ inputs.configuration }}_<架构>_selfcontained.exe`：自带运行时压缩版，无需安装 .NET；没有 .NET 的电脑、以及在框架依赖版上导出完整 Windows 离线包时使用。

          - `MCM_${{ inputs.configuration }}_linux-x64.tar.gz`：Linux x86-64 命令行版，解压后运行 `./mcm --help`。

          每个 `.exe` 都有对应的 `.sha256` 校验文件和 `.sigstore.json` 签名。Linux 压缩包提供 `.sha256` 校验文件。
          EOF

      - name: Document the game-intro preview
        run: |
          cat >> CHANGELOG.md <<'EOF'

          ## 游戏启动片头（预览）

          本次发布包内置片头视频，支持资源和客户端配置时默认开启。设置 `PCL3_GAME_INTRO_PREVIEW=0` 可关闭；`PCL3_LaunchIntro.mp4` 作为独立 Release 资源提供。
          验证范围为 Minecraft Java 1.21.1：原版、Fabric Loader 0.16.14、Forge 52.1.20 和 NeoForge 21.1.172。
          Linux 已在隔离 X11 环境通过四种真实客户端的播放和交接测试；需要 GTK 3、Python GI/Cairo 及 GStreamer 解码与音频输出插件。
          Windows 仅通过交叉构建，尚未完成原生媒体运行验收。其他版本、原生 Wayland 和全屏不在验证范围内。
          EOF

      - name: Stage the licensed intro asset for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v0.4.3 --pattern PCL3_LaunchIntro.mp4 --dir "$RUNNER_TEMP"
          test "$(stat -c%s "$RUNNER_TEMP/PCL3_LaunchIntro.mp4")" -eq 5209693
          echo "e46a7af3098ee66b91d57a9f72b44153a65fb18d6a9f37bb8d63ea118b942692  $RUNNER_TEMP/PCL3_LaunchIntro.mp4" | sha256sum --check
          cp "$RUNNER_TEMP/PCL3_LaunchIntro.mp4" ./PCL.GameIntro.Linux/PCL3_LaunchIntro.mp4

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          tag_name: v${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            PCL3_update.json
            MCM_skill.md
            MCM_skill.md.sha256
            PCL.GameIntro.Linux/PCL3_LaunchIntro.mp4
          prerelease: ${{ inputs.configuration == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    needs: [build, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
            variant: framework
            asset_suffix: ''
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
            variant: framework
            asset_suffix: ''
          - configuration: ${{ inputs.configuration }}
            architecture: x64
            variant: selfcontained
            asset_suffix: _selfcontained
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
            variant: selfcontained
            asset_suffix: _selfcontained
    env:
      ASSET_NAME: PCL3_${{ inputs.configuration }}_${{ matrix.architecture }}${{ matrix.asset_suffix }}
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL3_${{ inputs.configuration }}_${{ matrix.architecture }}${{ matrix.asset_suffix }}
          path: ./artifact

      - name: Rename binaries
        run: |
          mv "./artifact/Plain Craft Launcher 2.exe" "${ASSET_NAME}.exe"

      - name: Create SHA-256 manifest
        run: sha256sum "${ASSET_NAME}.exe" > "${ASSET_NAME}.sha256"

      - name: Sign the binary
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: PCL3_${{ inputs.configuration }}_${{ matrix.architecture }}${{ matrix.asset_suffix }}.exe
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release-publish.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          tag_name: v${{ inputs.version }}
          files: |
            PCL3_${{ inputs.configuration }}_${{ matrix.architecture }}${{ matrix.asset_suffix }}.exe
            PCL3_${{ inputs.configuration }}_${{ matrix.architecture }}${{ matrix.asset_suffix }}.exe.sigstore.json
            PCL3_${{ inputs.configuration }}_${{ matrix.architecture }}${{ matrix.asset_suffix }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux_cli_release:
    needs: [build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test shared core
        run: dotnet test PCL.Core.Shared.Tests/PCL.Core.Shared.Tests.csproj --configuration Release
      - name: Prepare pinned Tor runtime
        run: python3 scripts/prepare_tor_bundle.py linux-x86_64 "$RUNNER_TEMP/pcl3-tor-linux.tar.gz"
      - name: Download verified game-intro inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: game-intro-inputs
          path: ${{ runner.temp }}/game-intro
      - name: Publish Linux CLI
        env:
          INTRO_CLIP: ${{ format('{0}/game-intro/PCL3_LaunchIntro.mp4', runner.temp) }}
          INTRO_AGENT: ${{ format('{0}/game-intro/PCL3_LaunchIntroAgent.jar', runner.temp) }}
          PCL_WRITE_SECRET: '1'
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "$PCL_CURSEFORGE_API_KEY" ]; then
            echo '::error::Configure the CURSEFORGE_API_KEY Actions Secret before releasing.'
            exit 1
          fi
          dotnet publish PCL.Linux.Cli/PCL.Linux.Cli.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:UseSharedCompilation=false -p:PclTorBundle="$RUNNER_TEMP/pcl3-tor-linux.tar.gz" \
            -p:PclGameIntroClip="$INTRO_CLIP" -p:PclGameIntroAgent="$INTRO_AGENT" \
            -p:McmReleaseVersion="${{ inputs.version }}" \
            -o ./linux-artifact
          test -x ./linux-artifact/mcm
          python3 scripts/check_mcm_cli.py ./linux-artifact/mcm "${{ inputs.version }}"
          python3 scripts/check_mcm_offline.py ./linux-artifact/mcm
          cp PCL.Linux.Cli/README.md ./linux-artifact/README.md
          cp LICENSE ./linux-artifact/LICENSE
          tar -C ./linux-artifact -czf "MCM_${{ inputs.configuration }}_linux-x64.tar.gz" mcm README.md LICENSE
          sha256sum "MCM_${{ inputs.configuration }}_linux-x64.tar.gz" > "MCM_${{ inputs.configuration }}_linux-x64.tar.gz.sha256"
      - name: Upload Linux CLI to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          target_commitish: ${{ github.sha }}
          tag_name: v${{ inputs.version }}
          files: |
            MCM_${{ inputs.configuration }}_linux-x64.tar.gz
            MCM_${{ inputs.configuration }}_linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [rename_and_release, linux_cli_release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ inputs.version }}
          draft: false
