name: Build (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string
      variant:
        description: 'Launcher build variant: framework (framework-dependent) or selfcontained (compressed, self-contained)'
        required: true
        type: string
      include_game_intro:
        description: 'Embed the verified release-only game-intro resources'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.variant }})
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check launcher regressions and update isolation
        run: |
          python3 scripts/check_launcher_fixes.py
          python3 scripts/check_update_isolation.py
          python3 scripts/check_fork_privacy.py

      - name: Set Describe
        run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test update check regression
        run: dotnet run --project tests/UpdateRegression/UpdateRegression.csproj --configuration Release

      - name: Prepare pinned Tor runtime
        run: python3 scripts/prepare_tor_bundle.py windows-x86_64 "$RUNNER_TEMP/pcl3-tor-windows.tar.gz"

      - name: Download verified game-intro inputs
        if: ${{ inputs.include_game_intro }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: game-intro-inputs
          path: ${{ runner.temp }}/game-intro

      - name: Build Project
        env:
          INTRO_CLIP: ${{ inputs.include_game_intro && format('{0}/game-intro/PCL3_LaunchIntro.mp4', runner.temp) || '' }}
          INTRO_AGENT: ${{ inputs.include_game_intro && format('{0}/game-intro/PCL3_LaunchIntroAgent.jar', runner.temp) || '' }}
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ inputs.variant }}" = "selfcontained" ]; then
            dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.architecture }} \
            --runtime ${{ inputs.architecture == 'ARM64' && 'win-arm64' || 'win-x64' }} --self-contained true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PclTorBundle="$RUNNER_TEMP/pcl3-tor-windows.tar.gz" -p:PclGameIntroClip="$INTRO_CLIP" -p:PclGameIntroAgent="$INTRO_AGENT" -p:DeleteExistingFiles=true -o ./artifact
          elif [ "${{ inputs.variant }}" = "framework" ]; then
            dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.architecture }} \
            --no-self-contained \
            -p:PclTorBundle="$RUNNER_TEMP/pcl3-tor-windows.tar.gz" -p:PclGameIntroClip="$INTRO_CLIP" -p:PclGameIntroAgent="$INTRO_AGENT" -p:DeleteExistingFiles=true -o ./artifact
          else
            echo "::error::Unknown launcher build variant: ${{ inputs.variant }}"
            exit 1
          fi

      - name: Verify launcher artifact
        run: |
          exe="./artifact/Plain Craft Launcher 2.exe"
          test -f "$exe"
          size=$(stat -c%s "$exe")
          echo "Launcher size: $size bytes (variant: ${{ inputs.variant }})"
          if [ "${{ inputs.variant }}" = "selfcontained" ]; then
            # 自带运行时 + 压缩单文件：约 98 MB；明显偏离说明压缩开关或发布方式被改坏
            test "$size" -gt 60000000
            test "$size" -lt 160000000
          else
            # 框架依赖版包含 Tor 专家包；超过 70 MB 说明可能被打成了自带运行时
            test "$size" -lt 70000000
          fi

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL3_${{ inputs.configuration }}_${{ inputs.architecture }}${{ inputs.variant == 'selfcontained' && '_selfcontained' || '' }}
          path: artifact/**
