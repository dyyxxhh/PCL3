name: Prepare game-intro resources
description: Build the standalone game-intro assets and verify the launcher's content pins
outputs:
  clip:
    description: Verified MP4 path
    value: ${{ steps.prepare.outputs.clip }}
  agent:
    description: Built Java agent path
    value: ${{ steps.prepare.outputs.agent }}
runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      run: |
        set -euo pipefail
        source_clip="$GITHUB_WORKSPACE/PCL.GameIntro.Linux/PCL3_LaunchIntro.mp4"
        clip="$RUNNER_TEMP/PCL3_LaunchIntro.mp4"
        agent="$RUNNER_TEMP/PCL3_LaunchIntroAgent.jar"
        cp -- "$source_clip" "$clip"
        curl --fail --location --retry 3 --max-time 90 --output "$RUNNER_TEMP/asm-9.8.jar" https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar
        # javac output must match the class files behind the launcher pin, not the runner's default JDK.
        PATH="${JAVA_HOME_17_X64:?Java 17 is required}/bin:$PATH" python3 PCL.GameIntro.Agent/build.py "$RUNNER_TEMP/asm-9.8.jar" "$agent"
        python3 scripts/check_game_intro_release.py "$clip" "$agent"
        (
          cd "$RUNNER_TEMP"
          sha256sum -- "${clip##*/}" > "${clip##*/}.sha256"
          sha256sum -- "${agent##*/}" > "${agent##*/}.sha256"
        )
        printf 'clip=%s\nagent=%s\n' "$clip" "$agent" >> "$GITHUB_OUTPUT"
